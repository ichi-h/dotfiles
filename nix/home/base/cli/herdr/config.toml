onboarding = false

[keys]
prefix = "ctrl+t"

split_vertical = "prefix+percent"
split_horizontal = 'prefix+"'

[theme]
name = "terminal"
auto_switch = false

[ui]
status_indicators = "dots"
prompt_new_tab_name = false
tab_bar_right = [
  { type = "hostname" },
]

[ui.sound]
enabled = true
# 相対パスはこの設定ファイルのディレクトリ基準で解決される
path = "call-bell.mp3"
